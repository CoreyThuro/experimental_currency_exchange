[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "modulo-dilemma"
version = "0.1.0"
description = "Multi-agent economy simulation with modular-arithmetic currency"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["modulo_dilemma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
